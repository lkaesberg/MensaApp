# Builds a signed Android App Bundle and publishes it to the Google Play
# production track whenever a GitHub Release is published.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   PLAY_KEYSTORE_BASE64        base64 of the upload keystore (.jks)
#   PLAY_KEYSTORE_PASSWORD      keystore password
#   PLAY_KEY_ALIAS              key alias inside the keystore
#   PLAY_KEY_PASSWORD           password for that key
#   PLAY_SERVICE_ACCOUNT_JSON   full JSON key of the Play service account
#
# See .github/RELEASING.md for the one-time setup.
name: Release to Google Play

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'versionName to publish (e.g. 2.8). Defaults to the latest tag.'
        required: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: "✅ Checkout code"
        uses: actions/checkout@v4
        with:
          # Full history so the commit count can be used as versionCode.
          fetch-depth: 0

      - name: "⚙️ Set up JDK 21"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: "⚙️ Setup Gradle"
        uses: gradle/actions/setup-gradle@v4

      - name: "🔢 Derive version"
        id: version
        run: |
          set -euo pipefail
          RAW="${{ github.event.release.tag_name || inputs.version_name }}"
          if [ -z "$RAW" ]; then
            RAW="$(git describe --tags --abbrev=0)"
          fi
          # Strip a leading "v" so tag v2.8 becomes versionName 2.8.
          VERSION_NAME="${RAW#v}"
          VERSION_CODE="$(git rev-list --count HEAD)"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Publishing versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: "🔐 Decode keystore"
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::PLAY_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"

      - name: "🛠️ Build signed AAB"
        env:
          MENSA_KEYSTORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          MENSA_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          MENSA_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          MENSA_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          ./gradlew :composeApp:bundleRelease \
            -Pmensa.versionCode=${{ steps.version.outputs.code }} \
            -Pmensa.versionName=${{ steps.version.outputs.name }}

      - name: "📝 Prepare release notes"
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          mkdir -p distribution/whatsnew
          NOTES="$RELEASE_BODY"
          if [ -z "$NOTES" ]; then
            NOTES="Version ${{ steps.version.outputs.name }}"
          fi
          # Play rejects release notes longer than 500 characters.
          NOTES="$(printf '%s' "$NOTES" | head -c 500)"
          printf '%s' "$NOTES" > distribution/whatsnew/whatsnew-de-DE
          printf '%s' "$NOTES" > distribution/whatsnew/whatsnew-en-US

      - name: "🚀 Upload to Google Play"
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.lkaesberg.mensaapp
          releaseFiles: composeApp/build/outputs/bundle/release/composeApp-release.aab
          track: production
          status: completed
          whatsNewDirectory: distribution/whatsnew

      - name: "📦 Archive AAB"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mensa-app-${{ steps.version.outputs.name }}-aab
          path: composeApp/build/outputs/bundle/release/composeApp-release.aab
          if-no-files-found: warn

      - name: "🧹 Remove keystore"
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"
